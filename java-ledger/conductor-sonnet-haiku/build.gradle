plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
}

// Java 17 でコンパイルする（ローカルの JDK がそれより新しくても release 指定で 17 向けにビルドする）
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

// 実行時の外部依存は持たない。テスト用に JUnit 5 のみ使う
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'ledger.Main'
}

test {
    useJUnitPlatform()
}
